# Host nginx site for the platform admin app. Installed as
# /etc/nginx/sites-available/mhai-platform and linked into sites-enabled.
#
# Plain http never reaches the app: passwords and two-step codes go over
# https only, and the session cookie is Secure. This :80 block serves Let's
# Encrypt's challenge and redirects everything else to https.
#
# The app itself is served by the :443 block, which you add after certbot
# from the template in deploy/README.md (step 5). That block holds the allow
# list (/etc/nginx/mhai-platform-allow.conf, `allow <ip>;` lines kept by the
# product owner, then `deny all;`) and sends
# `Strict-Transport-Security "max-age=31536000" always`.

server {
    listen 80;
    server_name platforms.measured-health.org;
    server_tokens off;

    access_log /var/log/nginx/mhai-platform.access.log;
    error_log  /var/log/nginx/mhai-platform.error.log;

    # Let's Encrypt's HTTP-01 check comes from addresses we can't list, so the
    # challenge path is open. certbot --webroot writes the token under
    # /var/www/html.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else goes to https; the allow list applies there.
    location / {
        return 301 https://$host$request_uri;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
