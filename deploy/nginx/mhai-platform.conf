# Host nginx site for the platform admin app. Installed as
# /etc/nginx/sites-available/mhai-platform and linked into sites-enabled.
#
# Only addresses listed in /etc/nginx/mhai-platform-allow.conf (a host file of
# `allow <ip>;` lines, kept by the product owner) can reach it; everyone else
# gets 403.
#
# certbot adds the :443 block (see deploy/README.md). The allow and deny rules
# below must be in that block too: check it after certbot runs.

server {
    listen 80;
    server_name platforms.measured-health.org;
    server_tokens off;

    access_log /var/log/nginx/mhai-platform.access.log;
    error_log  /var/log/nginx/mhai-platform.error.log;

    include /etc/nginx/mhai-platform-allow.conf;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        # The app compares a write request's Origin with Host: keep $host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
