# Host nginx site for the mhai-web demo. Installed as
# /etc/nginx/sites-available/mhai-demo and linked into sites-enabled.
# certbot adds the :443 block (see deploy/README.md).

server {
    listen 80;
    server_name mhai-demo.measured-health.org;
    server_tokens off;

    access_log /var/log/nginx/mhai-demo.access.log;
    error_log  /var/log/nginx/mhai-demo.error.log;

    # Team-only demo: one shared password (htpasswd file, bcrypt).
    auth_basic           "MHAI demo";
    auth_basic_user_file /etc/nginx/mhai-demo.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
