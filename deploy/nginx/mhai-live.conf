# Host nginx site for the live clinical app (repository variable
# SITE_MODE=live; deploy/README.md, "Live site"). Since 22 Nov 2026
# ai.measured-health.org serves the live app; there is no public demo.
# Installed as /etc/nginx/sites-available/mhai-demo (the name the host has
# always used, so certbot's :443 block and its renewals stay where they are)
# and linked into sites-enabled. certbot adds the :443 block.
#
# It goes to web-live-proxy on 127.0.0.1:8093 (deploy/compose.yml), never to
# the demo's 8090: if the live app is down, visitors get an error from nginx,
# never the demo or sample data.
#
# X-Real-IP and X-Forwarded-For are overwritten with the address that
# connected here, never appended to: the live proxy believes X-Real-IP only
# from this nginx (deploy/nginx/live-proxy.conf.template), and core counts
# sign-in attempts per address.

server {
    listen 80;
    server_name ai.measured-health.org;
    server_tokens off;

    access_log /var/log/nginx/mhai-demo.access.log;
    error_log  /var/log/nginx/mhai-demo.error.log;

    # Letters (Plan 11) are bigger than nginx's 1 MB default; the app caps them.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        # The app compares a write request's Origin with Host: keep $host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
