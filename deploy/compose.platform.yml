# The platform admin app (platforms.measured-health.org), behind an IP allow
# list in nginx. Lives at /srv/mhai-web-platform on the instance, separate from
# the demo's /srv/mhai-web so the demo deploy never depends on this app's
# secret. PLATFORM_SESSION_SECRET (openssl rand -base64 48) lives in
# /srv/mhai-web-platform/.env, mode 600; compose reads it from there.

name: mhai-web-platform

services:
  platform:
    image: ${PLATFORM_IMAGE:-ghcr.io/measured-health/mhai-web-platform:latest}
    # The workflow pulls before every `up`, so a plain restart needs no GHCR login.
    pull_policy: missing
    restart: unless-stopped
    # Loopback only: nginx is the only way in.
    ports:
      - "127.0.0.1:8091:8080"
    mem_limit: 256m
    environment:
      PLATFORM_SESSION_SECRET: ${PLATFORM_SESSION_SECRET:?set in /srv/mhai-web-platform/.env}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The live preview of the platform app (docs/adr/0005): built for live
  # mode (image tag `live`), reaching core over NATS as bff_platform. Under
  # the profile `live`; loopback only, no nginx site, reached by SSH tunnel
  # (deploy/README.md). Core serves sign-in only for this app so far.
  platform-live:
    profiles: ["live"]
    image: ${PLATFORM_LIVE_IMAGE:-ghcr.io/measured-health/mhai-web-platform:live}
    pull_policy: missing
    restart: unless-stopped
    # No published port: only the proxy below reaches it.
    mem_limit: 256m
    environment:
      BACKEND_TRANSPORT: ${PLATFORM_LIVE_TRANSPORT:-nats}
      MHAI_DEPLOY_ENV: development
      NATS_URL: nats://mhai-nats:4222
      NATS_NKEY_SEED_FILE: /run/secrets/nats-bff-platform.nk
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      # Not :? here (see compose.yml): the deploy step checks it.
      PLATFORM_SESSION_SECRET: ${PLATFORM_LIVE_SESSION_SECRET:-}
    secrets: [nats-bff-platform.nk]
    networks: [default, mhai-bff]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The loopback proxy in front of platform-live: the only way in, on
  # 127.0.0.1:8094. It overwrites X-Real-IP with the connecting address
  # (deploy/nginx/live-proxy.conf.template), so the client IP the app sends
  # core is never one a browser chose.
  platform-live-proxy:
    profiles: ["live"]
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:8080"
    mem_limit: 64m
    environment:
      LIVE_UPSTREAM: platform-live:8080
    volumes:
      - ./live-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on: [platform-live]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

secrets:
  nats-bff-platform.nk:
    file: /srv/mhai-backend/secrets/bff/nats-bff-platform.nk

networks:
  mhai-bff:
    external: true
