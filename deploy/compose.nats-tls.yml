# The clinical app's BFF over NATS with TLS, for a backend in production mode
# (mhai-multiagent deploy/README.md, "Production mode"): an override for the
# `web-live` service of compose.yml, used as
#   docker compose -f compose.yml -f compose.nats-tls.yml --profile live up -d web-live
# The deploy workflow adds it whenever /srv/mhai-backend/production-mode
# exists, and the backend's production/enable-production.sh uses it for the
# switch (its --rollback goes back to compose.yml alone).
#
# NATS then verifies a client certificate from every client, so the app
# shows its own (bff-clinical, issued from the backend's private CA) and
# still signs in with its NKey. MHAI_DEPLOY_ENV is production: tls:// and
# the three files are required, a password is refused. The files are written
# by the backend's enable-production.sh: mode 400, owned by uid 1001 (the
# image's nextjs user); the key is never in the environment.

services:
  web-live:
    environment:
      MHAI_DEPLOY_ENV: production
      NATS_URL: tls://mhai-nats:4222
      NATS_TLS_CA_FILE: /run/secrets/nats-tls-ca.pem
      NATS_TLS_CERT_FILE: /run/secrets/nats-bff-clinical.pem
      NATS_TLS_KEY_FILE: /run/secrets/nats-bff-clinical-key.pem
    secrets:
      [
        nats-bff-clinical.nk,
        nats-tls-ca.pem,
        nats-bff-clinical.pem,
        nats-bff-clinical-key.pem,
      ]

secrets:
  nats-tls-ca.pem:
    file: ${MHAI_BACKEND_DIR:-/srv/mhai-backend}/secrets/bff/tls/ca.pem
  nats-bff-clinical.pem:
    file: ${MHAI_BACKEND_DIR:-/srv/mhai-backend}/secrets/bff/tls/bff-clinical.pem
  nats-bff-clinical-key.pem:
    file: ${MHAI_BACKEND_DIR:-/srv/mhai-backend}/secrets/bff/tls/bff-clinical-key.pem
