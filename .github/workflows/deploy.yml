name: Deploy demo

# After CI passes on main: build the arm64 image in GitHub, push it to GHCR,
# then have the preview instance pull it and restart the demo container.
# Building on the instance is avoided on purpose: it is small and also runs
# the EMR stack.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # The instance is Graviton (aarch64), so build natively on arm64.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: preview
    # Set the repo variable DEPLOY_ENABLED=true once the instance is set up
    # (deploy/README.md). Until then this workflow only publishes the image.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Pull and restart on the instance
        uses: appleboy/ssh-action@v1
        env:
          # Short-lived and scoped to this repo's package; expires with the job.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          envs: GHCR_TOKEN,GHCR_USER
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /srv/mhai-web

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull web
            docker compose up -d web

            # Straight to the container, past nginx's password: the home page
            # must load, and a dead consultation link must be a real 404.
            ok=0
            for _ in $(seq 1 24); do
              home=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/ || echo 000)
              gone=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/c/x || echo 000)
              if [ "$home" = 200 ] && [ "$gone" = 404 ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "Demo unhealthy (home=$home, /c/x=$gone). Recent logs:"
              docker compose logs --tail=120 web
              exit 1
            fi

            echo "Demo healthy."
            docker image prune -f
