name: Deploy demo

# After CI passes on main: build the arm64 images in GitHub (web and platform,
# in separate jobs), push them to GHCR, then have the preview instance pull
# them and restart the containers.
# Building on the instance is avoided on purpose: it is small and also runs
# the EMR stack.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-web:
    # Only a green CI run for a push to this repository's main. The branch
    # filter above matches by name alone, so a fork's PR from a branch called
    # "main" would otherwise build (and deploy) untrusted code.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # The instance is Graviton (aarch64), so build natively on arm64.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/clinical/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-platform:
    # A separate job, so a platform build or push that fails (a new GHCR
    # package, a platform-only break) never cancels the demo's build or
    # deploy (ruling R13). Same trust check as build-web.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # The instance is Graviton (aarch64), so build natively on arm64.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-platform
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/platform/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

  # The live preview images (docs/adr/0005): the same apps built with
  # USE_MOCK=false, tagged `live` and `live-sha-<commit>`. Only on a manual
  # run from main: the public demo's images and steps above never change.
  build-web-live:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The metadata action lowercases the image name (the organisation
      # has capitals; Docker refuses them).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=live
            type=sha,format=long,prefix=live-sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/clinical/Dockerfile
          platforms: linux/arm64
          build-args: USE_MOCK=false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-live
          cache-to: type=gha,mode=max,scope=web-live

  build-platform-live:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The metadata action lowercases the image name (the organisation
      # has capitals; Docker refuses them).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-platform
          tags: |
            type=raw,value=live
            type=sha,format=long,prefix=live-sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/platform/Dockerfile
          platforms: linux/arm64
          build-args: USE_MOCK=false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=platform-live
          cache-to: type=gha,mode=max,scope=platform-live

  deploy:
    needs: [build-web, build-platform, build-web-live, build-platform-live]
    runs-on: ubuntu-latest
    environment: preview
    # Set the repo variable DEPLOY_ENABLED=true once the instance is set up
    # (deploy/README.md). Until then this workflow only publishes the image.
    # always(): the demo deploys on a green web build whatever the platform
    # build did; the platform part runs only when its own build passed.
    if: >-
      always() &&
      needs.build-web.result == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    steps:
      # Without a host-key check the SSH step would trust whatever answers at
      # DEPLOY_HOST, and hand it the GHCR token. Refuse to deploy without one.
      - name: Require the host key fingerprint
        env:
          FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          case "$FINGERPRINT" in
            SHA256:?*) echo "Host key fingerprint set." ;;
            *) echo "::error::Secret DEPLOY_HOST_FINGERPRINT is missing or not SHA256:... (deploy/README.md)"; exit 1 ;;
          esac

      - name: Pull and restart on the instance
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Short-lived and scoped to this repo's package; expires with the job.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # "success" only when the platform image was built and pushed.
          PLATFORM_BUILD: ${{ needs.build-platform.result }}
          # "success" only on a manual run that built the live images.
          WEB_LIVE_BUILD: ${{ needs.build-web-live.result }}
          PLATFORM_LIVE_BUILD: ${{ needs.build-platform-live.result }}
        with:
          envs: GHCR_TOKEN,GHCR_USER,PLATFORM_BUILD,WEB_LIVE_BUILD,PLATFORM_LIVE_BUILD
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The host's ECDSA key, as "SHA256:..." (deploy/README.md).
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /srv/mhai-web

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull web
            docker compose up -d web

            # Straight to the container, not through nginx: the home page
            # must load, and a dead consultation link must be a real 404.
            ok=0
            for _ in $(seq 1 24); do
              home=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/ || echo 000)
              gone=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/c/x || echo 000)
              if [ "$home" = 200 ] && [ "$gone" = 404 ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "Demo unhealthy (home=$home, /c/x=$gone). Recent logs:"
              docker compose logs --tail=120 web
              exit 1
            fi
            echo "Demo healthy."

            # The platform app has its own folder and secret. Until that is
            # set up (deploy/README.md), or when its image didn't build, skip
            # it; the demo deploy still passes.
            if [ "$PLATFORM_BUILD" != success ]; then
              echo "Platform image not built ($PLATFORM_BUILD); skipped"
            elif [ -f /srv/mhai-web-platform/.env ] && grep -q '^PLATFORM_SESSION_SECRET=.' /srv/mhai-web-platform/.env; then
              cd /srv/mhai-web-platform
              docker compose -f compose.platform.yml pull platform
              docker compose -f compose.platform.yml up -d platform

              ok=0
              for _ in $(seq 1 24); do
                plat=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/sign-in || echo 000)
                csp=$(curl -s -D - -o /dev/null http://127.0.0.1:8091/sign-in | grep -ci '^content-security-policy:' || true)
                if [ "$plat" = 200 ] && [ "$csp" -ge 1 ]; then ok=1; break; fi
                sleep 5
              done
              if [ "$ok" != 1 ]; then
                echo "Platform unhealthy (/sign-in=$plat, csp=$csp). Recent logs:"
                docker compose -f compose.platform.yml logs --tail=120 platform
                exit 1
              fi
              echo "Platform healthy."
            else
              echo "Platform not set up yet; skipped"
            fi

            # The live previews (docs/adr/0005), after the public apps and
            # only when their image was built on this run, their session
            # secret is set and the backend's seed file exists
            # (deploy/README.md, "Live preview over NATS"). Never fatal for
            # the public deploy above.
            live() { # name dir composefile service port secretvar seed build
              local name=$1 dir=$2 file=$3 svc=$4 port=$5 var=$6 seed=$7 build=$8
              if [ "$build" != success ]; then echo "$name: no live image on this run; skipped"; return 0; fi
              if ! [ -f "$dir/.env" ] || ! grep -q "^$var=." "$dir/.env"; then echo "$name: $var not set in $dir/.env; skipped"; return 0; fi
              if ! [ -e "$seed" ]; then echo "$name: no NATS seed file at $seed; skipped"; return 0; fi
              if ! docker network inspect mhai-bff >/dev/null 2>&1; then echo "$name: no mhai-bff network; skipped"; return 0; fi
              if ! [ -f "$dir/live-proxy.conf.template" ]; then echo "$name: no live-proxy.conf.template in $dir; skipped"; return 0; fi
              # The app and its loopback proxy, the only way in (it sets X-Real-IP).
              ( cd "$dir"
                docker compose -f "$file" --profile live pull "$svc" "$svc-proxy"
                docker compose -f "$file" --profile live up -d "$svc" "$svc-proxy" )
              ok=0
              for _ in $(seq 1 24); do
                h=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/health" || echo 000)
                if [ "$h" = 200 ]; then ok=1; break; fi
                sleep 5
              done
              if [ "$ok" = 1 ]; then echo "$name healthy through its proxy (connected to NATS)."
              else
                echo "::warning::$name not healthy (/api/health=$h); the public apps are unaffected. Recent logs:"
                ( cd "$dir" && docker compose -f "$file" --profile live logs --tail=60 "$svc" "$svc-proxy" )
              fi
            }
            live web-live /srv/mhai-web compose.yml web-live 8093 WEB_LIVE_SESSION_SECRET \
              /srv/mhai-backend/secrets/bff/nats-bff-clinical.nk "$WEB_LIVE_BUILD" \
              || echo "::warning::web-live deploy failed; the public apps are unaffected"
            live platform-live /srv/mhai-web-platform compose.platform.yml platform-live 8094 PLATFORM_LIVE_SESSION_SECRET \
              /srv/mhai-backend/secrets/bff/nats-bff-platform.nk "$PLATFORM_LIVE_BUILD" \
              || echo "::warning::platform-live deploy failed; the public apps are unaffected"

            docker image prune -f
