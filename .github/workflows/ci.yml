name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

  # Unit tests run per app, alongside lint and typecheck.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [clinical, platform, shared]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (${{ matrix.part }})
        run: |
          case "${{ matrix.part }}" in
            clinical) npm test -w @mhai/clinical ;;
            platform) npm test -w @mhai/platform ;;
            shared)
              npm test -w packages --if-present
              node --test "scripts/**/*.test.mjs"
              ;;
          esac

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: |
            apps/clinical/.next/cache
            apps/platform/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Bundle check
        run: npm run check:bundle

      - name: Platform marker check
        run: npm run check:platform-marker

  # Each app's e2e suite runs in two shards, each in its own job, alongside the checks job.
  # Playwright's webServer builds the app, so no separate build step here.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [clinical, platform]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser system packages
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: next-e2e-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            next-e2e-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}-

      - name: E2E (mock mode)
        run: npm run e2e -w @mhai/${{ matrix.app }} -- --shard=${{ matrix.shard }}/2
        env:
          NEXT_PUBLIC_USE_MOCK: "true"

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}-${{ matrix.shard }}
          path: |
            apps/${{ matrix.app }}/playwright-report/
            apps/${{ matrix.app }}/test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
