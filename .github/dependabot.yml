# Weekly update PRs; CI must pass before a human merges them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          [
            "next",
            "eslint-config-next",
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom",
          ]
      dev-tools:
        dependency-type: development
    # Major versions of the toolchain need deliberate upgrades (e.g. TypeScript
    # 7 before typescript-eslint supports it; @types/node must match .nvmrc).
    # Do those by hand in their own PR.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
