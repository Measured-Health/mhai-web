# Weekly update PRs; CI must pass before a human merges them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          [
            "next",
            "eslint-config-next",
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom",
          ]
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
